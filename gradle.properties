# Spesifikasi memori untuk Gradle Daemon
# Disarankan minimal 2048MB (2GB), atau 4096MB (4GB) jika RAM laptop/PC Anda besar
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mengaktifkan AndroidX (Wajib untuk library modern)
android.useAndroidX=true

# Mengaktifkan fitur non-transitive R class (Mempercepat build & menghindari error resource)
android.nonTransitiveRClass=true

# Mengaktifkan Gradle Daemon agar build berikutnya lebih cepat
org.gradle.daemon=true

# Menggunakan parallel execution (Mempercepat build jika PC multi-core)
org.gradle.parallel=true

# Mengaktifkan caching (Build selanjutnya akan jauh lebih cepat)
org.gradle.caching=true